name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
          
      - name: Install dependencies
        run: uv sync --all-groups
        
      - name: Lint with ruff
        run: uv run ruff check .
        
      - name: Run Unit & Mock Tests
        env:
          OPENAI_API_KEY: "fake-key-for-testing"
        run: uv run pytest tests/test_api.py tests/test_models.py tests/test_config.py tests/test_guardrails.py tests/test_semantic_cache.py tests/test_resilience.py

      - name: Run LLM Quality Tests (Judge)
        if: env.OPENAI_API_KEY != ''
        run: uv run pytest tests/test_llm_judge_fast.py tests/test_llm_judge.py
