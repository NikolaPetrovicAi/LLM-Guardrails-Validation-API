[project]
name = "llm-guardrails-api"
version = "0.1.0"
description = "Enterprise LLM Guardrails & Validation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "instructor>=0.5.0",
    "openai>=1.13.0",
    "diskcache>=5.6.3",
    "python-json-logger>=2.0.7",
    "sentence-transformers>=5.3.0",
    "numpy>=2.4.3",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "langfuse==4.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "deepeval>=3.8.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "S", "B"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
